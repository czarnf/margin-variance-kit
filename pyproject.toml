[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "margin-variance-kit"
version = "0.1.0"
description = "A clean, tested reference implementation of CIMA standard-cost variance analysis (price, usage, yield) for manufacturing batch data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emmanuel Chiefson" }]
keywords = ["cost-accounting", "variance-analysis", "cima", "manufacturing", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Manufacturing",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
margin-variance = "margin_variance.cli:main"

[project.urls]
Homepage = "https://talosintelligentsystems.com"
Source = "https://github.com/czarnf/margin-variance-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/margin_variance"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
